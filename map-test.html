<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoGo Maps - Live Map Test</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h2 {
      text-align: center;
      margin: 12px;
    }

    #status {
      text-align: center;
      padding: 8px;
    }

    #map {
      height: 80vh;
      width: 100%;
    }

    .map-pin {
      width: 26px;
      height: 36px;
      display: block;
      filter: drop-shadow(0 2px 2px #555);
    }

    .map-pin svg {
      width: 26px;
      height: 36px;
    }
  </style>
</head>
<body>

  <h2>GoGo Maps - Live Database Map</h2>
  <div id="status">Loading businesses and promotions...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const supabaseUrl =
      "https://adifwwlmdditbdxjwbjn.supabase.co";

    const supabaseKey =
      "sb_publishable_mecjWlqMoO21dY33bzbDUw_KB7mSxuH";

    const map = L.map("map").setView([41.6168, 41.6367], 13);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    function makePin(color) {
      const html = `
        <div class="map-pin">
          <svg viewBox="0 0 26 36"
               xmlns="http://www.w3.org/2000/svg">
            <path
              d="M13 1 C6 1 1 6 1 13
                 C1 22 13 35 13 35
                 C13 35 25 22 25 13
                 C25 6 20 1 13 1 Z"
              fill="${color}"
              stroke="white"
              stroke-width="2"/>
            <circle cx="13" cy="13" r="5"
                    fill="white"/>
          </svg>
        </div>`;

      return L.divIcon({
        html: html,
        className: "",
        iconSize: [26, 36],
        iconAnchor: [13, 35],
        popupAnchor: [0, -32]
      });
    }

    const bluePin = makePin("#1677ff");
    const redPin = makePin("#e32636");

    async function getData(table) {
      const response = await fetch(
        supabaseUrl + "/rest/v1/" + table + "?select=*",
        {
          headers: {
            apikey: supabaseKey
          }
        }
      );

      if (!response.ok) {
        throw new Error(table + ": HTTP " + response.status);
      }

      return response.json();
    }

    async function loadMap() {
      try {
        const businesses = await getData("businesses");
        const promotions = await getData("promotions");

        let markerCount = 0;

        businesses.forEach(function(business) {
          if (business.latitude == null ||
              business.longitude == null) {
            return;
          }

          const promotion = promotions.find(function(p) {
            return p.business_id === business.id;
          });

          const marker = L.marker(
            [business.latitude, business.longitude],
            {
              icon: promotion ? redPin : bluePin
            }
          ).addTo(map);

          const popup = document.createElement("div");

          const name = document.createElement("strong");
          name.textContent = business.name;
          popup.appendChild(name);

          if (business.category) {
            const category = document.createElement("p");
            category.textContent = business.category;
            popup.appendChild(category);
          }

          if (business.address) {
            const address = document.createElement("p");
            address.textContent = business.address;
            popup.appendChild(address);
          }

          if (promotion) {
            const title = document.createElement("h3");
            title.textContent = promotion.offer_title;
            popup.appendChild(title);

            const description = document.createElement("p");
            description.textContent =
              promotion.offer_description || "";
            popup.appendChild(description);
          }

          marker.bindPopup(popup);
          markerCount++;
        });

        document.getElementById("status").textContent =
          "Connected successfully! " +
          markerCount + " businesses displayed on the map.";

      } catch (error) {
        document.getElementById("status").textContent =
          "Connection error: " + error.message;
      }
    }

    loadMap();
  </script>
</body>
</html>
