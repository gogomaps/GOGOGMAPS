eturn}const{data:roles,error:roleError}=await db.from("gogo_management_memberships").select("role").eq("user_id",user.id).eq("active",true).in("role",["global_owner","global_admin"]);if(roleError||!roles?.length){msg("Access restricted to authorised Global Owners and Global Admins.");return}const{data,error}=await db.from("gogo_batumi_applications").select("id,business_name,category,contact_name,contact_email,contact_phone,street_address,notes,status,created_at").order("created_at",{ascending:false}).limit(150);if(error){msg("Unable to load applications: "+error.message);return}msg((data||[]).length+" applications found. Review details before approving; approval does not publish a map listing automatically.");el("applications").replaceChildren();for(const a of data||[]){const card=document.createElement("article");card.className="card";const h=document.createElement("h2");h.textContent=a.business_name;card.append(h);const badge=document.createElement("span");badge.className="badge";badge.textContent=a.status;card.append(badge);for(const [label,value] of [["Category",a.category],["Contact",a.contact_name],["Email",a.contact_email],["Phone",a.contact_phone],["Address",a.street_address],["Notes",a.notes],["Submitted",a.created_at]]){if(!value)continue;const p=document.createElement("p");const strong=document.createElement("strong");strong.textContent=label+": ";p.append(strong,document.createTextNode(value));card.append(p)}for(const [label,next] of [["Approve application","approved"],["Reject application","rejected"]]){const b=document.createElement("button");b.textContent=label;if(next==="rejected")b.className="reject";b.disabled=a.status===next;b.onclick=async()=>{if(!confirm("Change "+a.business_name+" to "+next+"?"))return;b.disabled=true;const{error}=await db.from("gogo_batumi_applications").update({status:next}).eq("id",a.id);if(error){alert("Update failed: "+error.message);b.disabled=false;return}await load()};card.append(b)}if(a.status==="approved"){const publish=document.createElement("div");publish.style.cssText="background:#edf7ff;padding:15px;border-radius:10px;margin-top:15px";const title=document.createElement("h3");title.textContent="Publish approved business on Batumi map";publish.append(title);const note=document.createElement("p");note.textContent="Check the business location carefully. Click the map to place a marker. Publication is separate from approval.";publish.append(note);const coords=document.createElement("p");coords.textContent="No location selected yet.";publish.append(coords);const mapBox=document.createElement("div");mapBox.style.cssText="height:240px;border-radius:10px;overflow:hidden";publish.append(mapBox);const photo=document.createElement("input");photo.placeholder="Business photo HTTPS URL (optional)";photo.style.cssText="width:100%;padding:10px;margin-top:10px";publish.append(photo);const publishButton=document.createElement("button");publishButton.textContent="Publish verified location";publishButton.disabled=true;publish.append(publishButton);card.append(publish);const mini=L.map(mapBox).setView([41.6168,41.6367],13);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:19}).addTo(mini);let marker=null,point=null;mini.on("click",e=>{point=e.latlng;if(marker)marker.setLatLng(point);else marker=L.marker(point).addTo(mini);coords.textContent="Selected: "+point.lat.toFixed(6)+", "+point.lng.toFixed(6);publishButton.disabled=false});setTimeout(()=>mini.invalidateSize(),80);publishButton.onclick=async()=>{if(!point||!confirm("Publish "+a.business_name+" at the selected map location?"))return;publishButton.disabled=true;const payload={application_id:a.id,business_name:a.business_name,category:a.category,address:a.street_address,phone:a.contact_phone,latitude:point.lat,longitude:point.lng,photo_url:photo.value.trim()||null};const{error}=await db.from("gogo_batumi_published").upsert(payload,{onConflict:"application_id"});if(error){alert("Publishing failed: "+error.message);publishButton.disabled=false;return}alert("Listing published to the Batumi pilot map.");await load()}}el("applications").append(card)}}load().catch(e=>msg("Unable to load: "+e.message));</script></body></html>
