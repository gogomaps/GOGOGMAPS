<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batumi Applications | GoGo Maps Head Office</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5fc;color:#122c4b;font:15px system-ui,sans-serif}header{background:linear-gradient(110deg,#082a57,#1679b3);padding:20px 5vw;color:white;display:flex;align-items:center;gap:15px}header img{width:65px;height:65px;object-fit:contain}h1{font-size:25px;margin:0}main{max-width:1050px;margin:30px auto;padding:0 20px}.card{background:white;border:1px solid #dbe6f1;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 4px 15px #103c6110}.meta{color:#5b7084}.badge{display:inline-block;border-radius:20px;padding:5px 10px;background:#fff0cb;color:#7d5600;font-weight:800}button{border:0;background:#0875d7;color:white;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer;margin:6px 6px 0 0}button.reject{background:#b63a47}button:disabled{opacity:.5}a{color:#0871c7}.hidden{display:none}#message{font-weight:700}</style></head><body><header><img src="/logo.png" alt="GoGo Maps"><div><h1>Batumi Business Applications</h1><div>GoGo Maps · Global Head Office</div></div></header><main><p><a href="/global-private-business-manager-dev.html">← Head Office dashboard</a></p><p id="message" role="status">Checking your Head Office access…</p><section id="applications"></section></main><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const db=createClient("https://adifwwlmdditbdxjwbjn.supabase.co","sb_publishable_mecjWlqMoO21dY33bzbDUw_KB7mSxuH");const el=id=>document.getElementById(id),msg=s=>el("message").textContent=s;async function load(){const{data:{user},error:e}=await db.auth.getUser();if(e||!user){msg("Please sign in through Head Office first.");return}const{data:roles,error:roleError}=await db.from("gogo_management_memberships").select("role").eq("user_id",user.id).eq("active",true).in("role",["global_owner","global_admin"]);if(roleError||!roles?.length){msg("Access restricted to authorised Global Owners and Global Admins.");return}const{data,error}=await db.from("gogo_batumi_applications").select("id,business_name,category,contact_name,contact_email,contact_phone,street_address,notes,status,created_at").order("created_at",{ascending:false}).limit(150);if(error){msg("Unable to load applications: "+error.message);return}msg((data||[]).length+" applications found. Review details before approving; approval does not publish a map listing automatically.");el("applications").replaceChildren();for(const a of data||[]){const card=document.createElement("article");card.className="card";const h=document.createElement("h2");h.textContent=a.business_name;card.append(h);const badge=document.createElement("span");badge.className="badge";badge.textContent=a.status;card.append(badge);for(const [label,value] of [["Category",a.category],["Contact",a.contact_name],["Email",a.contact_email],["Phone",a.contact_phone],["Address",a.street_address],["Notes",a.notes],["Submitted",a.created_at]]){if(!value)continue;const p=document.createElement("p");const strong=document.createElement("strong");strong.textContent=label+": ";p.append(strong,document.createTextNode(value));card.append(p)}for(const [label,next] of [["Approve application","approved"],["Reject application","rejected"]]){const b=document.createElement("button");b.textContent=label;if(next==="rejected")b.className="reject";b.disabled=a.status===next;b.onclick=async()=>{if(!confirm("Change "+a.business_name+" to "+next+"?"))return;b.disabled=true;const{error}=await db.from("gogo_batumi_applications").update({status:next}).eq("id",a.id);if(error){alert("Update failed: "+error.message);b.disabled=false;return}await load()};card.append(b)}el("applications").append(card)}}load().catch(e=>msg("Unable to load: "+e.message));</script></body></html>
