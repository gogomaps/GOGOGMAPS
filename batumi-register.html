<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register your Batumi business | GoGo Maps</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5fd;color:#102b4c;font:16px system-ui,sans-serif}header{background:linear-gradient(110deg,#082a58,#1886c2);color:white;padding:30px 5vw;display:flex;align-items:center;gap:20px}header img{width:80px;height:80px;object-fit:contain}h1{margin:0;font-size:clamp(25px,4vw,38px)}main{max-width:760px;margin:35px auto;padding:0 20px}form{background:white;border-radius:18px;padding:30px;box-shadow:0 12px 35px #143c621c}label{display:block;font-weight:750;margin:17px 0 7px}input,select,textarea{width:100%;border:1px solid #b8cadc;border-radius:10px;padding:13px;font:inherit}textarea{min-height:95px}button{margin-top:24px;background:#0678ed;color:white;border:0;border-radius:10px;padding:15px 24px;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.note{background:#fff6df;border-radius:12px;padding:15px;line-height:1.6}#message{font-weight:750}a{color:#0769b9}</style></head><body><header><img src="/logo.png" alt="GoGo Maps logo"><div><h1>Join Batumi GO</h1><p>Apply to feature your local business on GoGo Maps</p></div></header><main><p><a href="/batumi-pilot.html">← Explore Batumi GO</a></p><div class="note">This is an application, not an instant listing. We review submissions before publishing business information or promotions. There is no payment required to submit an application.</div><form id="application"><label for="business">Business name *</label><input id="business" maxlength="120" required><label for="category">Category *</label><select id="category" required><option value="">Choose category</option><option>Restaurant</option><option>Cafe</option><option>Hotel</option><option>Shop</option><option>Pharmacy</option><option>Tourist service</option><option>Other local business</option></select><label for="contact">Contact person *</label><input id="contact" maxlength="120" required><label for="email">Contact email *</label><input id="email" type="email" maxlength="254" required><label for="phone">Telephone / WhatsApp</label><input id="phone" type="tel" maxlength="45"><label for="address">Batumi street address *</label><input id="address" maxlength="250" required><label for="notes">About your business (optional)</label><textarea id="notes" maxlength="1000"></textarea><button id="submit" type="submit">Send application</button><p id="message" role="status" aria-live="polite"></p></form></main><script>const endpoint="https://adifwwlmdditbdxjwbjn.supabase.co/rest/v1/gogo_batumi_applications",key="sb_publishable_mecjWlqMoO21dY33bzbDUw_KB7mSxuH",el=id=>document.getElementById(id);el("application").addEventListener("submit",async e=>{e.preventDefault();el("submit").disabled=true;el("message").textContent="Submitting your application…";const payload={business_name:el("business").value.trim(),category:el("category").value,contact_name:el("contact").value.trim(),contact_email:el("email").value.trim(),contact_phone:el("phone").value.trim()||null,street_address:el("address").value.trim(),notes:el("notes").value.trim()||null};try{const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","apikey":key,"Prefer":"return=minimal"},body:JSON.stringify(payload)});if(!r.ok)throw new Error("Submission failed ("+r.status+"). Please try again later.");el("application").reset();el("message").textContent="Application received. GoGo Maps will review it before publishing a listing."}catch(err){el("message").textContent=err.message}finally{el("submit").disabled=false}})</script></body></html>
