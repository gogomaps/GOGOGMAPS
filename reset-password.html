lowed=true;form.hidden=false;msg.textContent="Recovery link verified. Enter your new password."}});const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));if(params.get("error")||hash.get("error"))msg.textContent="This recovery link is invalid or expired. Request a fresh reset email.";setTimeout(()=>{if(!allowed&&msg.textContent==="Checking your recovery link…")msg.textContent="Recovery session not found. Please open a fresh password-reset email link."},3500);form.addEventListener("submit",async e=>{e.preventDefault();const p=document.getElementById("password").value;if(p!==document.getElementById("confirm").value){msg.textContent="Passwords do not match.";return}document.getElementById("save").disabled=true;const {error}=await db.auth.updateUser({password:p});if(error){msg.textContent=error.message;document.getElementById("save").disabled=false;return}form.hidden=true;msg.textContent="Password updated. You can now sign in to Head Office.";await db.auth.signOut()});</script></body></html>
